<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WatcherBridge — briefings</title>
<link rel="stylesheet" href="/style.css">
<script src="/app.js" defer></script>
</head>
<body>
<header>
  <h1>WatcherBridge</h1>
  <span id="conn" class="conn" role="status">connecting</span>
  <div class="filters">
    <label>Priority <select id="filter-priority">
      <option value="">all</option>
      <option value="critical">critical</option>
      <option value="high">high</option>
      <option value="medium">medium</option>
      <option value="low">low</option>
    </select></label>
    <label>Host <input id="filter-host" type="text" placeholder="anchor substring" autocomplete="off"></label>
    <label>Search <input id="filter-text" type="text" placeholder="text, id, token" autocomplete="off"></label>
  </div>
</header>
<main>
  <section class="left">
    <h2>Open groups</h2>
    <ul id="group-list" class="groups"></ul>
    <h2>Briefings</h2>
    <ol id="brief-list" class="briefs"></ol>
  </section>
  <section class="right">
    <h2>Dossier</h2>
    <div id="dossier"><p class="hint">Select a briefing.</p></div>
  </section>
</main>
<noscript><p>WatcherBridge viewer needs JavaScript for the live stream.</p></noscript>
</body>
</html>
