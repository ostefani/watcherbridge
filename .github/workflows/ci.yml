name: ci

on: [push, pull_request]

jobs:
  build-test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      CGO_ENABLED: 1 # mattn/go-sqlite3 requires cgo; runners ship a C toolchain
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version-file: ui/.nvmrc
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: gofmt (tracked files only; never third-party node_modules)
        run: test -z "$(gofmt -l $(git ls-files '*.go'))"
      - name: vet
        run: go vet $(go list ./... | grep -v '/node_modules/')
      - name: ui-check (lint, dist build, 200 KiB gzip budget)
        run: make ui-check
      - name: build
        run: go build $(go list ./... | grep -v '/node_modules/')
      - name: ui drift check (committed dist matches sources)
        run: make ui-drift
      - name: test
        run: go test $(go list ./... | grep -v '/node_modules/') -count=1
      - name: race
        run: go test -race $(go list ./... | grep -v '/node_modules/') -count=1

  e2e:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: three-process tap/proxy smoke (builds into .e2e-bin)
        run: ./e2e/run.sh
